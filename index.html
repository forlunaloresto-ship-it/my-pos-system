<!DOCTYPE html>
<html lang="tl">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food POS</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#222;
}
header{
  background:#d71920;
  color:white;
  padding:15px;
  text-align:center;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0002;
}
button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
}
.primary{background:#d71920;color:white}
.green{background:#168a45;color:white}
.gray{background:#777;color:white}
.danger{background:#b00020;color:white}
input,select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  margin:5px 0 10px;
}
.hidden{display:none}

.login{
  max-width:400px;
  margin:60px auto;
}
.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.tabs button{flex:1}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}
.product{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  background:#fff;
}
.product h3{margin:5px 0}
.price{
  font-size:20px;
  font-weight:bold;
}
.out{
  opacity:.5;
}

.cart-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  border-bottom:1px solid #ddd;
  padding:10px 0;
}
.qty button{
  padding:5px 9px;
}
.total{
  font-size:25px;
  font-weight:bold;
  margin:15px 0;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:left;
}
.small{font-size:13px;color:#666}
</style>
</head>

<body>

<header>
  <h2>🍗 FOOD POS</h2>
  <div id="userInfo"></div>
</header>

<div id="loginPage" class="container login">

  <div class="card">
    <h2>Login</h2>

    <label>User ID</label>
    <input id="loginId" placeholder="Admin o Cashier ID">

    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="Password">

    <button class="primary" style="width:100%" onclick="login()">
      LOGIN
    </button>

    <p class="small">
      Demo Admin: <b>admin</b> / <b>1234</b>
    </p>
  </div>

</div>


<div id="app" class="container hidden">

  <div class="tabs">
    <button class="primary" onclick="showPage('posPage')">🛒 POS</button>
    <button onclick="showPage('historyPage')">📋 History</button>
    <button id="adminBtn" onclick="showPage('adminPage')">⚙️ Admin</button>
    <button class="danger" onclick="logout()">Logout</button>
  </div>


  <!-- POS -->
  <div id="posPage">

    <div class="card">

      <h3>Order Type</h3>

      <button id="dineBtn" class="primary" onclick="setOrderType('Dine In')">
        🍽️ Dine In
      </button>

      <button id="takeBtn" onclick="setOrderType('Take Out')">
        🥡 Take Out
      </button>

      <p>
        Order #: <b id="orderNumber"></b>
      </p>

    </div>


    <div class="card">

      <h3>Menu</h3>

      <div id="menuList" class="menu"></div>

    </div>


    <div class="card">

      <h3>Current Order</h3>

      <div id="cart"></div>

      <div class="total">
        Total: ₱<span id="total">0.00</span>
      </div>

      <label>Cash Received</label>
      <input
        id="cash"
        type="number"
        placeholder="Ilagay ang bayad"
        oninput="calculateChange()"
      >

      <h3>
        Sukli: ₱<span id="change">0.00</span>
      </h3>

      <button class="green" style="width:100%" onclick="completeOrder()">
        ✅ COMPLETE ORDER
      </button>

      <button class="gray" style="width:100%;margin-top:8px"
              onclick="clearCart()">
        CLEAR ORDER
      </button>

    </div>

  </div>


  <!-- HISTORY -->
  <div id="historyPage" class="hidden">

    <div class="card">
      <h2>📋 Sales History</h2>

      <button class="gray" onclick="clearHistory()">
        Clear History
      </button>

      <div id="history"></div>
    </div>

  </div>


  <!-- ADMIN -->
  <div id="adminPage" class="hidden">

    <div class="card">

      <h2>⚙️ Admin Menu Management</h2>

      <h3>Add Menu</h3>

      <input id="newName" placeholder="Product name">

      <input id="newPrice"
             type="number"
             placeholder="Price">

      <button class="green" onclick="addMenu()">
        ➕ Add Menu
      </button>

    </div>


    <div class="card">

      <h3>Existing Menu</h3>

      <div id="adminMenu"></div>

    </div>

  </div>

</div>


<script>

let currentUser = null;

let orderType = "Dine In";

let cart = [];

let menu = JSON.parse(localStorage.getItem("foodMenu")) || [
  {
    id:1,
    name:"Sundae",
    price:50,
    available:true
  },
  {
    id:2,
    name:"Fries",
    price:50,
    available:true
  },
  {
    id:3,
    name:"Fried Chicken",
    price:99,
    available:true
  },
  {
    id:4,
    name:"Float",
    price:60,
    available:true
  }
];

let sales = JSON.parse(localStorage.getItem("foodSales")) || [];

let orderNo =
  Number(localStorage.getItem("orderNumber") || 1000) + 1;

document.getElementById("orderNumber").innerText = orderNo;


/* LOGIN */

function login(){

  let id =
    document.getElementById("loginId").value.trim();

  let password =
    document.getElementById("loginPassword").value;

  if(id === "admin" && password === "1234"){

    currentUser = {
      id:"admin",
      role:"admin"
    };

  }else if(id && password){

    currentUser = {
      id:id,
      role:"cashier"
    };

  }else{

    alert("Ilagay ang ID at password.");
    return;

  }

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  document.getElementById("userInfo").innerText =
    currentUser.role.toUpperCase() +
    " • ID: " +
    currentUser.id;

  document.getElementById("adminBtn").style.display =
    currentUser.role === "admin"
    ? "block"
    : "none";

  renderMenu();
  renderHistory();
  renderAdminMenu();

}


/* LOGOUT */

function logout(){

  currentUser = null;
  cart = [];

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("loginId").value = "";
  document.getElementById("loginPassword").value = "";

}


/* PAGE */

function showPage(page){

  document.getElementById("posPage")
    .classList.add("hidden");

  document.getElementById("historyPage")
    .classList.add("hidden");

  document.getElementById("adminPage")
    .classList.add("hidden");

  document.getElementById(page)
    .classList.remove("hidden");

}


/* ORDER TYPE */

function setOrderType(type){

  orderType = type;

  document.getElementById("dineBtn")
    .className =
    type === "Dine In"
    ? "primary"
    : "";

  document.getElementById("takeBtn")
    .className =
    type === "Take Out"
    ? "primary"
    : "";

}


/* MENU */

function renderMenu(){

  let html = "";

  menu.forEach(item => {

    html += `
      <div class="product ${!item.available ? "out" : ""}">

        <h3>${item.name}</h3>

        <div class="price">
          ₱${Number(item.price).toFixed(2)}
        </div>

        ${
          item.available
          ?
          `<button class="primary"
             style="width:100%;margin-top:8px"
             onclick="addToCart(${item.id})">
             ADD
           </button>`
          :
          `<button disabled style="width:100%;margin-top:8px">
             OUT OF STOCK
           </button>`
        }

      </div>
    `;

  });

  document.getElementById("menuList").innerHTML = html;

}


/* ADD TO CART */

function addToCart(id){

  let item =
    menu.find(x => x.id === id);

  if(!item || !item.available) return;

  let existing =
    cart.find(x => x.id === id);

  if(existing){

    existing.qty++;

  }else{

    cart.push({
      id:item.id,
      name:item.name,
      price:Number(item.price),
      qty:1
    });

  }

  renderCart();

}


/* CART */

function renderCart(){

  let html = "";

  if(cart.length === 0){

    html = "<p>Wala pang order.</p>";

  }

  cart.forEach(item => {

    html += `
      <div class="cart-row">

        <div>
          <b>${item.name}</b><br>
          ₱${item.price.toFixed(2)}
        </div>

        <div class="qty">

          <button onclick="changeQty(${item.id},-1)">
            -
          </button>

          <b>${item.qty}</b>

          <button onclick="changeQty(${item.id},1)">
            +
          </button>

        </div>

        <b>
          ₱${(item.price * item.qty).toFixed(2)}
        </b>

      </div>
    `;

  });

  document.getElementById("cart").innerHTML = html;

  updateTotal();

}


/* QUANTITY */

function changeQty(id, amount){

  let item =
    cart.find(x => x.id === id);

  if(!item) return;

  item.qty += amount;

  if(item.qty <= 0){

    cart =
      cart.filter(x => x.id !== id);

  }

  renderCart();

}


/* TOTAL */

function getTotal(){

  return cart.reduce(
    (sum,item) =>
      sum + item.price * item.qty,
    0
  );

}

function updateTotal(){

  document.getElementById("total")
    .innerText =
    getTotal().toFixed(2);

  calculateChange();

}


/* CHANGE */

function calculateChange(){

  let total = getTotal();

  let cash =
    Number(document.getElementById("cash").value || 0);

  let change =
    cash - total;

  document.getElementById("change")
    .innerText =
    (change > 0 ? change : 0).toFixed(2);

}


/* COMPLETE ORDER */

function completeOrder(){

  if(cart.length === 0){

    alert("Wala pang order.");
    return;

  }

  let total = getTotal();

  let cash =
    Number(document.getElementById("cash").value || 0);

  if(cash < total){

    alert(
      "Kulang ang bayad.\n" +
      "Total: ₱" + total.toFixed(2)
    );

    return;

  }

  let change = cash - total;

  let sale = {

    orderNo:orderNo,

    date:new Date().toLocaleString(),

    cashier:currentUser.id,

    type:orderType,

    items:[...cart],

    total:total,

    cash:cash,

    change:change

  };

  sales.unshift(sale);

  localStorage.setItem(
    "foodSales",
    JSON.stringify(sales)
  );

  localStorage.setItem(
    "orderNumber",
    orderNo
  );

  alert(
    "ORDER COMPLETED!\n\n" +
    "Order #: " + orderNo + "\n" +
    "Total: ₱" + total.toFixed(2) + "\n" +
    "Bayad: ₱" + cash.toFixed(2) + "\n" +
    "Sukli: ₱" + change.toFixed(2)
  );

  orderNo++;

  document.getElementById("orderNumber")
    .innerText = orderNo;

  cart = [];

  document.getElementById("cash").value = "";

  renderCart();
  renderHistory();

}


/* CLEAR CART */

function clearCart(){

  cart = [];

  document.getElementById("cash").value = "";

  renderCart();

}


/* HISTORY */

function renderHistory(){

  let html = "";

  if(sales.length === 0){

    html = "<p>Wala pang sales.</p>";

  }else{

    html += `
      <table>

        <tr>
          <th>Order</th>
          <th>Date</th>
          <th>Cashier</th>
          <th>Type</th>
          <th>Total</th>
        </tr>
    `;

    sales.forEach(sale => {

      html += `
        <tr>

          <td>#${sale.orderNo}</td>

          <td>${sale.date}</td>

          <td>${sale.cashier}</td>

          <td>${sale.type}</td>

          <td>
            ₱${sale.total.toFixed(2)}
          </td>

        </tr>
      `;

    });

    html += "</table>";

  }

  document.getElementById("history")
    .innerHTML = html;

}


/* CLEAR HISTORY */

function clearHistory(){

  if(currentUser.role !== "admin"){

    alert("Admin lang ang puwedeng gumawa nito.");
    return;

  }

  if(!confirm("Burahin lahat ng sales history?"))
    return;

  sales = [];

  localStorage.removeItem("foodSales");

  renderHistory();

}


/* ADMIN MENU */

function renderAdminMenu(){

  let html = "";

  menu.forEach(item => {

    html += `
      <div class="card">

        <b>${item.name}</b>

        <p>
          Presyo:
          ₱${Number(item.price).toFixed(2)}
        </p>

        <p>
          Status:
          ${item.available
            ? "AVAILABLE"
            : "OUT OF STOCK"}
        </p>

        <button
          class="primary"
          onclick="editMenu(${item.id})">
          ✏️ Edit
        </button>

        <button
          class="gray"
          onclick="toggleStock(${item.id})">
          ${item.available
            ? "🚫 Out of Stock"
            : "✅ Available"}
        </button>

        <button
          class="danger"
          onclick="deleteMenu(${item.id})">
          🗑️ Delete
        </button>

      </div>
    `;

  });

  document.getElementById("adminMenu")
    .innerHTML = html;

}


/* ADD MENU */

function addMenu(){

  let name =
    document.getElementById("newName").value.trim();

  let price =
    Number(document.getElementById("newPrice").value);

  if(!name || price <= 0){

    alert("Ilagay ang pangalan at tamang presyo.");
    return;

  }

  let id =
    Date.now();

  menu.push({

    id:id,
    name:name,
    price:price,
    available:true

  });

  saveMenu();

  document.getElementById("newName").value = "";
  document.getElementById("newPrice").value = "";

  renderMenu();
  renderAdminMenu();

  alert("Nadagdag na ang menu.");

}


/* EDIT MENU */

function editMenu(id){

  let item =
    menu.find(x => x.id === id);

  if(!item) return;

  let newName =
    prompt("Product name:",item.name);

  if(newName === null) return;

  let newPrice =
    prompt("Price:",item.price);

  if(newPrice === null) return;

  newPrice =
    Number(newPrice);

  if(!newName.trim() || newPrice <= 0){

    alert("Invalid.");
    return;

  }

  item.name =
    newName.trim();

  item.price =
    newPrice;

  saveMenu();

  renderMenu();
  renderAdminMenu();

}


/* DELETE MENU */

function deleteMenu(id){

  let item =
    menu.find(x => x.id === id);

  if(!item) return;

  if(!confirm(
    "Burahin ang " +
    item.name +
    "?"
  )) return;

  menu =
    menu.filter(x => x.id !== id);

  saveMenu();

  renderMenu();
  renderAdminMenu();

}


/* STOCK */

function toggleStock(id){

  let item =
    menu.find(x => x.id === id);

  if(!item) return;

  item.available =
    !item.available;

  saveMenu();

  renderMenu();
  renderAdminMenu();

}


/* SAVE MENU */

function saveMenu(){

  localStorage.setItem(
    "foodMenu",
    JSON.stringify(menu)
  );

}
  
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js");
}
</script>  
</body>
</html>
