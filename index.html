<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<title>Food POS</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
color:#222;
}

header{
background:#d71920;
color:white;
padding:15px;
text-align:center;
}

.container{
max-width:1100px;
margin:auto;
padding:15px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 8px #0002;
}

button{
border:0;
border-radius:8px;
padding:10px 14px;
cursor:pointer;
font-weight:bold;
}

button:disabled{
cursor:not-allowed;
}

input{
width:100%;
padding:11px;
margin:6px 0 10px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.primary{
background:#d71920;
color:white;
}

.green{
background:#168a45;
color:white;
}

.gray{
background:#777;
color:white;
}

.danger{
background:#b00020;
color:white;
}

.hidden{
display:none;
}

.login{
max-width:400px;
margin:60px auto;
}

.tabs{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:15px;
}

.tabs button{
flex:1;
min-width:100px;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
}

.product{
border:1px solid #ddd;
border-radius:10px;
padding:12px;
background:#fff;
}

.product h3{
margin:5px 0;
}

.price{
font-size:20px;
font-weight:bold;
}

.out{
opacity:.5;
}

.cart-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
border-bottom:1px solid #ddd;
padding:10px 0;
}

.qty{
display:flex;
align-items:center;
gap:6px;
}

.qty button{
padding:5px 9px;
}

.total{
font-size:25px;
font-weight:bold;
margin:15px 0;
}

table{
width:100%;
border-collapse:collapse;
display:block;
overflow-x:auto;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
text-align:left;
white-space:nowrap;
}

.small{
font-size:13px;
color:#666;
}

.active{
color:green;
font-weight:bold;
}

.disabled{
color:#b00020;
font-weight:bold;
}

.admin-item{
border:1px solid #ddd;
border-radius:10px;
padding:12px;
margin-bottom:10px;
}

.admin-item button{
margin:3px;
}

.receipt{
font-family:monospace;
font-size:13px;
}

@media(max-width:500px){

.container{
padding:10px;
}

.card{
padding:12px;
}

.cart-row{
font-size:14px;
}

.total{
font-size:22px;
}

}
</style>
</head>

<body>

<header>

<h2>🍗 FOOD POS</h2>

<div id="userInfo"></div>

</header>


<!-- LOGIN -->

<div id="loginPage" class="container login">

<div class="card">

<h2>🔐 Login</h2>

<label>User ID</label>

<input
id="loginId"
placeholder="Admin o Cashier ID"
autocomplete="username"
>

<label>Password</label>

<input
id="loginPassword"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button
class="primary"
style="width:100%"
onclick="login()"
>

LOGIN

</button>

<p class="small">

Admin:
<b>admin</b> / <b>2026</b>

<br>

Cashier:
<b>CASH001</b> / <b>2026</b>

</p>

</div>

</div>


<!-- APP -->

<div id="app" class="container hidden">

<div class="tabs">

<button
class="primary"
onclick="showPage('posPage')"
>
🛒 POS
</button>

<button
onclick="showPage('historyPage')"
>
📋 History
</button>

<button
id="adminBtn"
onclick="showPage('adminPage')"
>
⚙️ Admin
</button>

<button
class="danger"
onclick="logout()"
>
Logout
</button>

</div>


<!-- POS -->

<div id="posPage">

<div class="card">

<h3>Order Type</h3>

<button
id="dineBtn"
class="primary"
onclick="setOrderType('Dine In')"
>
🍽️ Dine In
</button>

<button
id="takeBtn"
onclick="setOrderType('Take Out')"
>
🥡 Take Out
</button>

<p>
Order #:
<b id="orderNumber">1001</b>
</p>

</div>


<div class="card">

<h3>Menu</h3>

<div
id="menuList"
class="menu"
></div>

</div>


<div class="card">

<h3>Current Order</h3>

<div id="cart"></div>

<div class="total">

Total:
₱<span id="total">0.00</span>

</div>

<label>Cash Received</label>

<input
id="cash"
type="number"
inputmode="decimal"
placeholder="Ilagay ang bayad"
oninput="calculateChange()"
>

<h3>

Sukli:
₱<span id="change">0.00</span>

</h3>

<button
class="green"
style="width:100%"
onclick="completeOrder()"
>
✅ COMPLETE ORDER
</button>

<button
class="gray"
style="width:100%;margin-top:8px"
onclick="clearCart()"
>
CLEAR ORDER
</button>

</div>

</div>


<!-- HISTORY -->

<div
id="historyPage"
class="hidden"
>

<div class="card">

<h2>📋 Sales History</h2>

<button
class="gray"
onclick="clearHistory()"
>
Clear History
</button>

<div id="history"></div>

</div>

</div>


<!-- ADMIN -->

<div
id="adminPage"
class="hidden"
>


<!-- MENU MANAGEMENT -->

<div class="card">

<h2>🍔 Menu Management</h2>

<h3>Add Menu</h3>

<input
id="newName"
placeholder="Product name"
>

<input
id="newPrice"
type="number"
inputmode="decimal"
placeholder="Price"
>

<button
class="green"
onclick="addMenu()"
>
➕ Add Menu
</button>

</div>


<div class="card">

<h3>Existing Menu</h3>

<div id="adminMenu"></div>

</div>


<!-- CASHIER MANAGEMENT -->

<div class="card">

<h2>👤 Cashier Management</h2>

<h3>Add Cashier</h3>

<input
id="newCashierName"
placeholder="Cashier name"
>

<input
id="newCashierId"
placeholder="User ID"
>

<input
id="newCashierPassword"
type="password"
placeholder="Password"
>

<button
class="green"
onclick="addCashier()"
>
➕ Add Cashier
</button>

</div>


<div class="card">

<h3>Cashier Accounts</h3>

<div id="cashierList"></div>

</div>

</div>

</div>


<script>

/* =========================
   SAFE LOCAL STORAGE
========================= */

function getStorageArray(key, fallback){

try{

let data =
localStorage.getItem(key);

if(!data){

return fallback;

}

let parsed =
JSON.parse(data);

return Array.isArray(parsed)
? parsed
: fallback;

}catch(error){

console.log(
"Storage error:",
key,
error
);

return fallback;

}

}


/* =========================
   GLOBAL VARIABLES
========================= */

let currentUser = null;

let orderType = "Dine In";

let cart = [];


/* =========================
   DEFAULT MENU
========================= */

let menu =
getStorageArray(
"foodMenu",
[
{
id:1,
name:"Sundae",
price:50,
available:true
},
{
id:2,
name:"Fries",
price:50,
available:true
},
{
id:3,
name:"Fried Chicken",
price:99,
available:true
},
{
id:4,
name:"Float",
price:60,
available:true
}
]
);


/* =========================
   DEFAULT CASHIERS
========================= */

let cashiers =
getStorageArray(
"foodCashiers",
[
{
id:"CASH001",
name:"Cashier 1",
password:"2026",
active:true
}
]
);


/* =========================
   SALES
========================= */

let sales =
getStorageArray(
"foodSales",
[]
);


/* =========================
   ORDER NUMBER
========================= */

let savedOrderNumber =
Number(
localStorage.getItem("orderNumber")
);

if(
!Number.isFinite(savedOrderNumber) ||
savedOrderNumber < 1000
){

savedOrderNumber = 1000;

}

let orderNo =
savedOrderNumber + 1;


/* =========================
   START APP
========================= */

document.addEventListener(
"DOMContentLoaded",
function(){

document.getElementById(
"orderNumber"
).innerText = orderNo;

renderMenu();

renderCart();

renderHistory();

renderAdminMenu();

renderCashiers();

}
);


/* =========================
   LOGIN
========================= */

function login(){

let id =
document.getElementById(
"loginId"
).value.trim();

let password =
document.getElementById(
"loginPassword"
).value;


if(
id === "admin" &&
password === "2026"
){

currentUser = {

id:"admin",

name:"Administrator",

role:"admin"

};

}

else{

let cashier =
cashiers.find(
function(x){

return (
String(x.id).toLowerCase()
===
id.toLowerCase()
&&
String(x.password)
===
password
);

}
);


if(!cashier){

alert(
"Mali ang User ID o Password."
);

return;

}


if(!cashier.active){

alert(
"Disabled ang cashier account."
);

return;

}


currentUser = {

id:cashier.id,

name:cashier.name,

role:"cashier"

};

}


document.getElementById(
"loginPage"
).classList.add("hidden");

document.getElementById(
"app"
).classList.remove("hidden");


document.getElementById(
"userInfo"
).innerText =

currentUser.role.toUpperCase()
+
" • "
+
currentUser.name
+
" • ID: "
+
currentUser.id;


document.getElementById(
"adminBtn"
).style.display =

currentUser.role === "admin"
? "block"
: "none";


renderMenu();

renderHistory();

renderAdminMenu();

renderCashiers();

showPage("posPage");

}


/* =========================
   LOGOUT
========================= */

function logout(){

currentUser = null;

cart = [];

document.getElementById(
"app"
).classList.add("hidden");

document.getElementById(
"loginPage"
).classList.remove("hidden");

document.getElementById(
"loginId"
).value = "";

document.getElementById(
"loginPassword"
).value = "";

}


/* =========================
   PAGE
========================= */

function showPage(page){

if(
page === "adminPage"
&&
(
!currentUser
||
currentUser.role !== "admin"
)
){

alert(
"Admin lang ang puwedeng pumasok dito."
);

return;

}


document.getElementById(
"posPage"
).classList.add("hidden");

document.getElementById(
"historyPage"
).classList.add("hidden");

document.getElementById(
"adminPage"
).classList.add("hidden");


let selectedPage =
document.getElementById(page);

if(selectedPage){

selectedPage.classList.remove(
"hidden"
);

}

}


/* =========================
   ORDER TYPE
========================= */

function setOrderType(type){

orderType = type;

document.getElementById(
"dineBtn"
).className =
type === "Dine In"
? "primary"
: "";


document.getElementById(
"takeBtn"
).className =
type === "Take Out"
? "primary"
: "";

}


/* =========================
   RENDER MENU
========================= */

function renderMenu(){

let html = "";

menu.forEach(
function(item){

html += `

<div class="product ${
item.available ? "" : "out"
}">

<h3>
${escapeHtml(item.name)}
</h3>

<div class="price">

₱${Number(item.price).toFixed(2)}

</div>

${
item.available

?

`<button
class="primary"
style="width:100%;margin-top:8px"
onclick="addToCart(${item.id})"
>
ADD
</button>`

:

`<button
disabled
style="width:100%;margin-top:8px"
>
OUT OF STOCK
</button>`

}

</div>

`;

}
);


document.getElementById(
"menuList"
).innerHTML = html;

}


/* =========================
   ADD TO CART
========================= */

function addToCart(id){

let item =
menu.find(
function(x){
return x.id === id;
}
);


if(
!item ||
!item.available
){

return;

}


let existing =
cart.find(
function(x){
return x.id === id;
}
);


if(existing){

existing.qty++;

}

else{

cart.push({

id:item.id,

name:item.name,

price:Number(item.price),

qty:1

});

}


renderCart();

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

let html = "";


if(cart.length === 0){

html =
"<p>Wala pang order.</p>";

}


cart.forEach(
function(item){

html += `

<div class="cart-row">

<div>

<b>
${escapeHtml(item.name)}
</b>

<br>

₱${Number(item.price).toFixed(2)}

</div>


<div class="qty">

<button
onclick="changeQty(${item.id},-1)"
>
-
</button>

<b>
${item.qty}
</b>

<button
onclick="changeQty(${item.id},1)"
>
+
</button>

</div>


<b>

₱${
(
Number(item.price)
*
Number(item.qty)
).toFixed(2)
}

</b>

</div>

`;

}
);


document.getElementById(
"cart"
).innerHTML = html;

updateTotal();

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQty(id,amount){

let item =
cart.find(
function(x){
return x.id === id;
}
);


if(!item){

return;

}


item.qty += amount;


if(item.qty <= 0){

cart =
cart.filter(
function(x){
return x.id !== id;
}
);

}


renderCart();

}


/* =========================
   TOTAL
========================= */

function getTotal(){

return cart.reduce(
function(sum,item){

return (
sum +
Number(item.price)
*
Number(item.qty)
);

},
0
);

}


function updateTotal(){

document.getElementById(
"total"
).innerText =
getTotal().toFixed(2);

calculateChange();

}


/* =========================
   CHANGE
========================= */

function calculateChange(){

let total =
getTotal();

let cash =
Number(
document.getElementById(
"cash"
).value || 0
);


let change =
cash - total;


document.getElementById(
"change"
).innerText =

(
change > 0
? change
: 0
).toFixed(2);

}


/* =========================
   COMPLETE ORDER
========================= */

function completeOrder(){

if(cart.length === 0){

alert(
"Wala pang order."
);

return;

}


let total =
getTotal();


let cash =
Number(
document.getElementById(
"cash"
).value || 0
);


if(cash < total){

alert(

"Kulang ang bayad.\n\n"
+
"Total: ₱"
+
total.toFixed(2)

);

return;

}


let change =
cash - total;


let sale = {

orderNo:orderNo,

date:
new Date()
.toLocaleString(),

cashier:
currentUser
? currentUser.id
: "",

type:orderType,

items:
cart.map(
function(item){

return {

id:item.id,

name:item.name,

price:item.price,

qty:item.qty

};

}
),

total:total,

cash:cash,

change:change

};


sales.unshift(sale);


try{

localStorage.setItem(
"foodSales",
JSON.stringify(sales)
);

localStorage.setItem(
"orderNumber",
String(orderNo)
);

}catch(error){

alert(
"May problema sa pag-save ng order."
);

console.log(error);

return;

}


alert(

"ORDER COMPLETED!\n\n"
+
"Order #: "
+
orderNo
+
"\nTotal: ₱"
+
total.toFixed(2)
+
"\nBayad: ₱"
+
cash.toFixed(2)
+
"\nSukli: ₱"
+
change.toFixed(2)

);


orderNo++;

document.getElementById(
"orderNumber"
).innerText = order
   
}

</script>

</body>
</html>
