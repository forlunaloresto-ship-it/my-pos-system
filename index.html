<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My POS System</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#d71920;color:white;padding:16px;text-align:center;font-size:24px;font-weight:bold}
.wrap{max-width:1000px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.card{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0002}
button{border:0;border-radius:8px;padding:12px 14px;font-weight:bold;cursor:pointer}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.menu button{background:#fff0d9;text-align:left}
.total{font-size:28px;font-weight:bold}.change{font-size:22px;color:#138a36}
input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px}
.small{color:#666;font-size:13px}.danger{background:#d71920;color:white}.primary{background:#198754;color:white}
@media(max-width:700px){.grid{grid-template-columns:1fr}.menu{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>MY POS SYSTEM</header>
<div class="wrap">
<div class="card">
  <label>Cashier ID</label><input id="cashier" placeholder="Hal. C001">
  <label>Order Type</label><select id="orderType"><option>Dine In</option><option>Take Out</option></select>
</div>
<br>
<div class="grid">
<section class="card">
<h2>Menu</h2>
<div class="menu" id="menu"></div>
</section>
<section class="card">
<h2>Current Order</h2>
<div id="order">Wala pang order.</div>
<hr>
<div>Total: <span class="total" id="total">₱0.00</span></div>
<label>Cash</label><input id="cash" type="number" inputmode="decimal" placeholder="0">
<div>Change: <span class="change" id="change">₱0.00</span></div>
<br>
<button class="primary" onclick="saveSale()">SAVE SALE</button>
<button class="danger" onclick="clearOrder()">CLEAR</button>
</section>
</div>
<br>
<section class="card">
<h2>Sales History</h2>
<div id="history"></div>
</section>
</div>
<script>
const products=[
 ["Sundae",50],["Fries",50],["Fried Chicken",100],["Burger",80],["Float",60],["Rice",25]
];
let cart=[];
const peso=n=>"₱"+Number(n).toFixed(2);
function renderMenu(){
 menu.innerHTML=products.map((p,i)=>`<button onclick="add(${i})">${p[0]}<br><b>${peso(p[1])}</b></button>`).join("");
}
function add(i){let x=cart.find(a=>a.i===i);if(x)x.q++;else cart.push({i,q:1});renderOrder();}
function renderOrder(){
 if(!cart.length){order.innerHTML="Wala pang order."}else{
 order.innerHTML=cart.map((x,k)=>`${products[x.i][0]} × ${x.q} = ${peso(products[x.i][1]*x.q)} <button onclick="removeItem(${k})">−</button>`).join("<br>");
 }
 let t=cart.reduce((s,x)=>s+products[x.i][1]*x.q,0);total.textContent=peso(t);
 let c=Number(cash.value||0)-t;change.textContent=peso(Math.max(0,c));
}
function removeItem(k){cart.splice(k,1);renderOrder()}
cash.addEventListener("input",renderOrder);
function clearOrder(){cart=[];cash.value="";renderOrder()}
function saveSale(){
 if(!cart.length)return alert("Maglagay muna ng order.");
 let t=cart.reduce((s,x)=>s+products[x.i][1]*x.q,0), c=Number(cash.value||0);
 if(c<t)return alert("Kulang ang cash.");
 let sales=JSON.parse(localStorage.getItem("sales")||"[]");
 sales.unshift({date:new Date().toLocaleString(),cashier:cashier.value||"Unknown",type:orderType.value,total:t,cash:c,change:c-t,items:cart.map(x=>({name:products[x.i][0],qty:x.q}))});
 localStorage.setItem("sales",JSON.stringify(sales)); renderHistory(); alert("Sale saved!"); clearOrder();
}
function renderHistory(){
 let s=JSON.parse(localStorage.getItem("sales")||"[]");
 history.innerHTML=s.length?s.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #ddd"><b>${peso(x.total)}</b> — ${x.type}<br><span class="small">${x.date} | Cashier: ${x.cashier} | Change: ${peso(x.change)}</span></div>`).join(""):"Wala pang sales.";
}
renderMenu();renderHistory();renderOrder();
</script>
</body>
</html>
