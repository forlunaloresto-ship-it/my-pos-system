<!DOCTYPE html>
<html lang="tl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ffffff">

<title>Food POS</title>


<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
color:#222;
}

header{
background:#d71920;
color:white;
padding:15px;
text-align:center;
}

.container{
max-width:1100px;
margin:auto;
padding:15px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 8px #0002;
}

button{
border:0;
border-radius:8px;
padding:10px 14px;
cursor:pointer;
font-weight:bold;
}

button:disabled{
cursor:not-allowed;
opacity:.6;
}

input,
select{
width:100%;
padding:11px;
margin:6px 0 10px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.primary{
background:#d71920;
color:white;
}

.green{
background:#168a45;
color:white;
}

.gray{
background:#777;
color:white;
}

.danger{
background:#b00020;
color:white;
}

.blue{
background:#1769aa;
color:white;
}

.orange{
background:#f08a00;
color:white;
}

.hidden{
display:none!important;
}

.login{
max-width:400px;
margin:60px auto;
}

.tabs{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:15px;
}

.tabs button{
flex:1;
min-width:100px;
}

.menu{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(150px,1fr));
gap:10px;
}

.product{
border:1px solid #ddd;
border-radius:10px;
padding:12px;
background:#fff;
}

.product h3{
margin:5px 0;
}

.price{
font-size:20px;
font-weight:bold;
}

.out{
opacity:.5;
}

.cart-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
border-bottom:1px solid #ddd;
padding:10px 0;
}

.qty{
display:flex;
align-items:center;
gap:6px;
}

.qty button{
padding:5px 9px;
}

.total{
font-size:25px;
font-weight:bold;
margin:15px 0;
}

table{
width:100%;
border-collapse:collapse;
display:block;
overflow-x:auto;
}

th,
td{
padding:8px;
border-bottom:1px solid #ddd;
text-align:left;
white-space:nowrap;
}

.small{
font-size:13px;
color:#666;
}

.active{
color:green;
font-weight:bold;
}

.disabled{
color:#b00020;
font-weight:bold;
}

.admin-item{
border:1px solid #ddd;
border-radius:10px;
padding:12px;
margin-bottom:10px;
}

.admin-item button{
margin:3px;
}

.receipt{
font-family:monospace;
font-size:13px;
}

.summary{
background:#f7f7f7;
border-radius:8px;
padding:10px;
margin-top:10px;
}

.shift-open{
background:#e8f8ee;
border:1px solid #168a45;
color:#126b35;
}

.shift-closed{
background:#fff0f0;
border:1px solid #d71920;
color:#a00000;
}

.stat-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(160px,1fr));
gap:10px;
}

.stat{
background:#f7f7f7;
border-radius:10px;
padding:15px;
border:1px solid #ddd;
}

.stat-number{
font-size:24px;
font-weight:bold;
margin-top:5px;
}

.receipt-preview{
background:white;
border:1px dashed #aaa;
padding:10px;
font-family:monospace;
max-width:320px;
margin:10px auto;
}

@media(max-width:500px){

.container{
padding:10px;
}

.card{
padding:12px;
}

.cart-row{
font-size:14px;
}

.total{
font-size:22px;
}

}


/* =========================
   THERMAL RECEIPT PRINT
========================= */

@media print{

body{
background:white;
margin:0;
padding:0;
}

body *{
visibility:hidden;
}

#printReceipt,
#printReceipt *{
visibility:visible;
}

#printReceipt{
position:absolute;
left:0;
top:0;
width:58mm;
padding:2mm;
font-family:monospace;
font-size:11px;
color:#000;
background:#fff;
}

.no-print{
display:none!important;
}

@page{
size:58mm auto;
margin:0;
}

}


/* Receipt screen holder */

#printReceipt{
display:none;
}

</style>

</head>


<body>


<header>

<h2>🍗 FOOD POS</h2>

<div id="userInfo"></div>

</header>



<!-- =========================
     LOGIN
========================= -->

<div id="loginPage"
class="container login">

<div class="card">

<h2>🔐 Login</h2>

<label>User ID</label>

<input
id="loginId"
placeholder="Admin o Cashier ID"
autocomplete="username"
>

<label>Password</label>

<input
id="loginPassword"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button
class="primary"
style="width:100%"
onclick="login()"
>
LOGIN
</button>

<p class="small">

Admin:
<b>admin</b> / <b>2026</b>

<br>

Cashier:
<b>CASH001</b> / <b>2026</b>

</p>

</div>

</div>



<!-- =========================
     APP
========================= -->

<div id="app"
class="container hidden">


<div class="tabs">

<button
class="primary"
onclick="showPage('posPage')"
>
🛒 POS
</button>

<button
onclick="showPage('historyPage')"
>
📋 History
</button>

<button
id="adminBtn"
onclick="showPage('adminPage')"
>
⚙️ Admin
</button>

<button
class="danger"
onclick="logout()"
>
Logout
</button>

</div>



<!-- =========================
     SHIFT PANEL
========================= -->

<div id="shiftPanel"
class="card">

<h3>🕐 Cashier Shift</h3>

<div id="shiftStatus">
</div>

<div id="shiftControls">

<label>
Shift Type
</label>

<select id="shiftType">

<option value="Opening">
Opening Shift
</option>

<option value="Closing">
Closing Shift
</option>

</select>

<button
class="green"
style="width:100%"
onclick="startShift()"
>
▶️ START SHIFT
</button>

</div>

<div id="closeShiftControls"
class="hidden">

<button
class="danger"
style="width:100%"
onclick="closeShift()"
>
🔴 CLOSE SHIFT
</button>

</div>

</div>



<!-- =========================
     POS
========================= -->

<div id="posPage">

<div class="card">

<h3>Order Type</h3>

<button
id="dineBtn"
class="primary"
onclick="setOrderType('Dine In')"
>
🍽️ Dine In
</button>

<button
id="takeBtn"
onclick="setOrderType('Take Out')"
>
🥡 Take Out
</button>

<p>

Order #:
<b id="orderNumber">1001</b>

</p>

</div>



<div class="card">

<h3>Menu</h3>

<div
id="menuList"
class="menu"
></div>

</div>



<div class="card">

<h3>Current Order</h3>

<div id="cart"></div>

<div class="total">

Total:
₱<span id="total">0.00</span>

</div>

<label>
Cash Received
</label>

<input
id="cash"
type="number"
inputmode="decimal"
placeholder="Ilagay ang bayad"
oninput="calculateChange()"
>

<h3>

Sukli:
₱<span id="change">0.00</span>

</h3>

<button
class="green"
style="width:100%"
onclick="completeOrder()"
>
✅ COMPLETE ORDER
</button>

<button
class="blue"
style="width:100%;margin-top:8px"
onclick="printLastReceipt()"
>
🧾 PRINT LAST RECEIPT
</button>

<button
class="gray"
style="width:100%;margin-top:8px"
onclick="clearCart()"
>
CLEAR ORDER
</button>

</div>

</div>



<!-- =========================
     HISTORY
========================= -->

<div id="historyPage"
class="hidden">

<div class="card">

<h2>📋 Sales History</h2>

<button
class="gray"
onclick="clearHistory()"
>
Clear History
</button>

<div id="history"></div>

</div>

</div>



<!-- =========================
     ADMIN
========================= -->

<div
id="adminPage"
class="hidden"
>


<!-- SALES SUMMARY -->

<div class="card">

<h2>📊 Sales & Shift Summary</h2>

<div id="salesSummary"></div>

</div>



<!-- MENU MANAGEMENT -->

<div class="card">

<h2>🍔 Menu Management</h2>

<h3>Add Menu</h3>

<input
id="newName"
placeholder="Product name"
>

<input
id="newPrice"
type="number"
inputmode="decimal"
placeholder="Price"
>

<button
class="green"
onclick="addMenu()"
>
➕ Add Menu
</button>

</div>



<div class="card">

<h3>Existing Menu</h3>

<div id="adminMenu"></div>

</div>



<!-- CASHIER MANAGEMENT -->

<div class="card">

<h2>👤 Cashier Management</h2>

<h3>Add Cashier</h3>

<input
id="newCashierName"
placeholder="Cashier name"
>

<input
id="newCashierId"
placeholder="User ID"
>

<input
id="newCashierPassword"
type="password"
placeholder="Password"
>

<button
class="green"
onclick="addCashier()"
>
➕ Add Cashier
</button>

</div>



<div class="card">

<h3>Cashier Accounts</h3>

<div id="cashierList"></div>

</div>

</div>

</div>



<!-- =========================
     PRINT RECEIPT
========================= -->

<div id="printReceipt"></div>



<script>


/* =========================
   STORAGE
========================= */

function getStorageArray(key,fallback){

try{

let data=localStorage.getItem(key);

if(!data){
return fallback;
}

let parsed=JSON.parse(data);

return Array.isArray(parsed)
? parsed
: fallback;

}catch(error){

console.log(error);

return fallback;

}

}



/* =========================
   GLOBAL
========================= */

let currentUser=null;

let orderType="Dine In";

let cart=[];

let lastSale=null;



/* =========================
   DEFAULT MENU
========================= */

let menu=getStorageArray(
"foodMenu",
[
{
id:1,
name:"Sundae",
price:50,
available:true
},
{
id:2,
name:"Fries",
price:50,
available:true
},
{
id:3,
name:"Fried Chicken",
price:99,
available:true
},
{
id:4,
name:"Float",
price:60,
available:true
}
]
);



/* =========================
   DEFAULT CASHIERS
========================= */

let cashiers=getStorageArray(
"foodCashiers",
[
{
id:"CASH001",
name:"Cashier 1",
password:"2026",
active:true
}
]
);



/* =========================
   SALES
========================= */

let sales=getStorageArray(
"foodSales",
[]
);



/* =========================
   SHIFT HISTORY
========================= */

let shifts=getStorageArray(
"foodShifts",
[]
);



/* =========================
   ACTIVE SHIFT
========================= */

let activeShift=null;

try{

let savedShift=
localStorage.getItem(
"activeShift"
);

if(savedShift){

activeShift=
JSON.parse(savedShift);

}

}catch(error){

activeShift=null;

}



/* =========================
   ORDER NUMBER
========================= */

let savedOrderNumber=Number(
localStorage.getItem("orderNumber")
);

if(
!Number.isFinite(savedOrderNumber) ||
savedOrderNumber<1000
){

savedOrderNumber=1000;

}

let orderNo=savedOrderNumber+1;



/* =========================
   SAVE FUNCTIONS
========================= */

function saveMenu(){

try{

localStorage.setItem(
"foodMenu",
JSON.stringify(menu)
);

}catch(error){

console.log(error);

alert("Hindi ma-save ang menu.");

}

}



function saveCashiers(){

try{

localStorage.setItem(
"foodCashiers",
JSON.stringify(cashiers)
);

}catch(error){

console.log(error);

alert("Hindi ma-save ang cashier.");

}

}



function saveSales(){

try{

localStorage.setItem(
"foodSales",
JSON.stringify(sales)
);

}catch(error){

console.log(error);

}

}



function saveShifts(){

try{

localStorage.setItem(
"foodShifts",
JSON.stringify(shifts)
);

}catch(error){

console.log(error);

}

}



function saveActiveShift(){

try{

if(activeShift){

localStorage.setItem(
"activeShift",
JSON.stringify(activeShift)
);

}else{

localStorage.removeItem(
"activeShift"
);

}

}catch(error){

console.log(error);

}

}



/* =========================
   START
========================= */

document.addEventListener(
"DOMContentLoaded",
function(){

document.getElementById(
"orderNumber"
).innerText=orderNo;

renderMenu();

renderCart();

renderHistory();

renderAdminMenu();

renderCashiers();

renderSalesSummary();

updateShiftUI();

}
);



/* =========================
   LOGIN
========================= */

function login(){

let id=document.getElementById(
"loginId"
).value.trim().toLowerCase();

let password=document.getElementById(
"loginPassword"
).value.trim();


/* ADMIN */

if(
id==="admin" &&
password==="2026"
){

currentUser={
id:"admin",
name:"Administrator",
role:"admin"
};

}


/* CASHIER */

else{

let cashier=cashiers.find(
function(x){

return(
String(x.id)
.trim()
.toLowerCase()===id
&&
String(x.password)
.trim()===password
);

}
);


if(!cashier){

alert(
"Mali ang User ID o Password."
);

return;

}


if(!cashier.active){

alert(
"Disabled ang cashier account."
);

return;

}


currentUser={
id:cashier.id,
name:cashier.name,
role:"cashier"
};

}


document.getElementById(
"loginPage"
).classList.add("hidden");

document.getElementById(
"app"
).classList.remove("hidden");


document.getElementById(
"userInfo"
).innerText=
currentUser.role.toUpperCase()
+
" • "
+
currentUser.name
+
" • ID: "
+
currentUser.id;


document.getElementById(
"adminBtn"
).style.display=
currentUser.role==="admin"
? "block"
: "none";


renderMenu();

renderCart();

renderHistory();

renderAdminMenu();

renderCashiers();

renderSalesSummary();

updateShiftUI();

showPage("posPage");

}



/* =========================
   LOGOUT
========================= */

function logout(){

currentUser=null;

cart=[];

document.getElementById(
"app"
).classList.add("hidden");

document.getElementById(
"loginPage"
).classList.remove("hidden");

document.getElementById(
"loginId"
).value="";

document.getElementById(
"loginPassword"
).value="";

clearCart();

}



/* =========================
   PAGE
========================= */

function showPage(page){

if(
page==="adminPage" &&
(
!currentUser ||
currentUser.role!=="admin"
)
){

alert(
"Admin lang ang puwedeng pumasok dito."
);

return;

}


document.getElementById(
"posPage"
).classList.add("hidden");

document.getElementById(
"historyPage"
).classList.add("hidden");

document.getElementById(
"adminPage"
).classList.add("hidden");


let selected=document.getElementById(page);

if(selected){

selected.classList.remove("hidden");

}

}



/* =========================
   ORDER TYPE
========================= */

function setOrderType(type){

orderType=type;

document.getElementById(
"dineBtn"
).className=
type==="Dine In"
? "primary"
: "";

document.getElementById(
"takeBtn"
).className=
type==="Take Out"
? "primary"
: "";

}



/* =========================
   SHIFT FUNCTIONS
========================= */

function startShift(){

if(
!currentUser ||
currentUser.role!=="cashier"
){

alert(
"Ang shift ay para sa cashier."
);

return;

}


if(activeShift){

if(
activeShift.cashier===currentUser.id
){

alert(
"May active shift ka na."
);

}else{

alert(
"May active shift ang ibang cashier."
);

}

return;

}


let type=document.getElementById(
"shiftType"
).value;


activeShift={

id:"SHIFT-"+Date.now(),

cashier:currentUser.id,

cashierName:currentUser.name,

type:type,

startTime:new Date().toLocaleString(),

startTimestamp:Date.now(),

endTime:"",

endTimestamp:0,

orders:0,

sales:0

};


saveActiveShift();

updateShiftUI();

renderSalesSummary();


alert(
"Na-open na ang "+
type+
" Shift.\n\n"+
"Cashier: "+
currentUser.name+
"\nShift: "+
type+
"\nStart: "+
activeShift.startTime
);

}



function closeShift(){

if(
!currentUser ||
currentUser.role!=="cashier"
){

return;

}


if(!activeShift){

alert(
"Walang active shift."
);

return;

}


if(
activeShift.cashier!==currentUser.id
){

alert(
"Hindi ikaw ang may-ari ng active shift."
);

return;

}


let shiftSales=sales.filter(
function(sale){

return sale.shiftId===activeShift.id;

}
);


let total=shiftSales.reduce(
function(sum,sale){

return sum+
Number(sale.total||0);

},
0
);


let shiftOrders=shiftSales.length;


if(
!confirm(
"Isara ang shift?\n\n"+
"Cashier: "+activeShift.cashierName+
"\nShift: "+activeShift.type+
"\nOrders: "+shiftOrders+
"\nTotal Sales: ₱"+total.toFixed(2)
)
){

return;

}


let closedShift={

...activeShift,

endTime:new Date().toLocaleString(),

endTimestamp:Date.now(),

orders:shiftOrders,

sales:total

};


shifts.unshift(
closedShift
);

saveShifts();


activeShift=null;

saveActiveShift();

updateShiftUI();

renderSalesSummary();


alert(
"SHIFT CLOSED!\n\n"+
"Cashier: "+closedShift.cashierName+
"\nShift: "+closedShift.type+
"\nOrders: "+closedShift.orders+
"\nTotal Sales: ₱"+
closedShift.sales.toFixed(2)+
"\n\n"+
"Start: "+closedShift.startTime+
"\nEnd: "+closedShift.endTime
);

}



function updateShiftUI(){

let status=document.getElementById(
"shiftStatus"
);

let controls=document.getElementById(
"shiftControls"
);

let closeControls=document.getElementById(
"closeShiftControls"
);


if(!status){

return;

}


/* ADMIN */

if(
currentUser &&
currentUser.role==="admin"
){

status.innerHTML=`

<div class="summary">

<b>👑 ADMIN MODE</b>

<br>

Hindi kailangan ng cashier shift.

</div>

`;

controls.classList.add("hidden");

closeControls.classList.add("hidden");

return;

}


/* WALANG LOGIN */

if(!currentUser){

status.innerHTML=
"<p>Mag-login muna.</p>";

controls.classList.remove("hidden");

closeControls.classList.add("hidden");

return;

}


/* MAY ACTIVE SHIFT */

if(activeShift){

if(
activeShift.cashier===
currentUser.id
){

status.innerHTML=`

<div class="summary shift-open">

<b>🟢 SHIFT OPEN</b>

<br>

Cashier:
${escapeHtml(activeShift.cashierName)}

<br>

Shift:
<b>${escapeHtml(activeShift.type)}</b>

<br>

Start:
${escapeHtml(activeShift.startTime)}

<br>

Current Sales:
<b>
₱${getActiveShiftSales().toFixed(2)}
</b>

<br>

Orders:
<b>
${getActiveShiftOrders()}
</b>

</div>

`;

controls.classList.add("hidden");

closeControls.classList.remove("hidden");

}else{

status.innerHTML=`

<div class="summary shift-closed">

<b>🔴 MAY ACTIVE SHIFT ANG IBANG CASHIER</b>

<br>

Cashier:
${escapeHtml(activeShift.cashierName)}

</div>

`;

controls.classList.add("hidden");

closeControls.classList.add("hidden");

}

}else{

status.innerHTML=`

<div class="summary shift-closed">

<b>🔴 NO ACTIVE SHIFT</b>

<br>

Pumili ng Opening o Closing Shift
at pindutin ang START SHIFT.

</div>

`;

controls.classList.remove("hidden");

closeControls.classList.add("hidden");

}

}



function getActiveShiftSales(){

if(!activeShift){

return 0;

}

return sales.reduce(
function(sum,sale){

if(
sale.shiftId===
activeShift.id
){

return sum+
Number(sale.total||0);

}

return sum;

},
0
);

}



function getActiveShiftOrders(){

if(!activeShift){

return 0;

}

return sales.filter(
function(sale){

return sale.shiftId===
activeShift.id;

}
).length;

}



/* =========================
   RENDER MENU
========================= */

function renderMenu(){

let html="";


menu.forEach(
function(item){

let id=Number(item.id);

html+=`

<div class="product ${
item.available ? "" : "out"
}">

<h3>
${escapeHtml(item.name)}
</h3>

<div class="price">
₱${Number(item.price).toFixed(2)}
</div>

${
item.available

?

`<button
class="primary"
style="width:100%;margin-top:8px"
onclick="addToCart(${id})"
>
ADD
</button>`

:

`<button
disabled
style="width:100%;margin-top:8px"
>
OUT OF STOCK
</button>`

}

</div>

`;

}
);


document.getElementById(
"menuList"
).innerHTML=html;

}



/* =========================
   ADD CART
========================= */

function addToCart(id){

if(
currentUser &&
currentUser.role==="cashier" &&
!activeShift
){

alert(
"Mag-open muna ng shift bago mag-order."
);

return;

}


let item=menu.find(
function(x){

return Number(x.id)===Number(id);

}
);


if(
!item ||
!item.available
){

return;

}


let existing=cart.find(
function(x){

return Number(x.id)===Number(id);

}
);


if(existing){

existing.qty++;

}else{

cart.push({

id:Number(item.id),

name:item.name,

price:Number(item.price),

qty:1

});

}


renderCart();

}



/* =========================
   RENDER CART
========================= */

function renderCart(){

let html="";


if(cart.length===0){

html="<p>Wala pang order.</p>";

}


cart.forEach(
function(item){

html+=`

<div class="cart-row">

<div>

<b>
${escapeHtml(item.name)}
</b>

<br>

₱${Number(item.price).toFixed(2)}

</div>


<div class="qty">

<button
onclick="changeQty(${item.id},-1)"
>
-
</button>

<b>${item.qty}</b>

<button
onclick="changeQty(${item.id},1)"
>
+
</button>

</div>


<b>

₱${
(
Number(item.price)*

function changeQty(id,amount){

let item=cart.find(
function(x){

return Number(x.id)===Number(id);

}
);

return;

}


item.qty+=amount;

cart=cart.filter(
function(x){

return Number(x.id)!==Number(id);

);

/* =========================
   TOTAL
========================= */

function getTotal(){

return cart.reduce(
function(sum,item){

return sum+
(
Number(item.price)*
Number(item.qty)
);

},
0
);

}



function updateTotal(){

document.getElementById(
"total"
).innerText=
getTotal().toFixed(2);

calculateChange();

}



/* =========================
   CHANGE
========================= */

function calculateChange(){

let total=getTotal();

let cash=Number(
document.getElementById(
"cash"
).value||0
);

let change=cash-total;

document.getElementById(
"change"
).innerText=
(
change>0
? change
: 0
).toFixed(2);

}

let sale={

);

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}



/* =========================
   SAFE JAVASCRIPT VALUE
========================= */

function safeJs(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,"&quot;");

}
