<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<title>Food POS</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
color:#222;
}

header{
background:#d71920;
color:white;
padding:15px;
text-align:center;
}

.container{
max-width:1100px;
margin:auto;
padding:15px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 8px #0002;
}

button{
border:0;
border-radius:8px;
padding:10px 14px;
cursor:pointer;
font-weight:bold;
}

button:disabled{
cursor:not-allowed;
opacity:.6;
}

input{
width:100%;
padding:11px;
margin:6px 0 10px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.primary{
background:#d71920;
color:white;
}

.green{
background:#168a45;
color:white;
}

.gray{
background:#777;
color:white;
}

.danger{
background:#b00020;
color:white;
}

.blue{
background:#1769aa;
color:white;
}

.hidden{
display:none!important;
}

.login{
max-width:400px;
margin:60px auto;
}

.tabs{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:15px;
}

.tabs button{
flex:1;
min-width:100px;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
}

.product{
border:1px solid #ddd;
border-radius:10px;
padding:12px;
background:#fff;
}

.product h3{
margin:5px 0;
}

.price{
font-size:20px;
font-weight:bold;
}

.out{
opacity:.5;
}

.cart-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
border-bottom:1px solid #ddd;
padding:10px 0;
}

.qty{
display:flex;
align-items:center;
gap:6px;
}

.qty button{
padding:5px 9px;
}

.total{
font-size:25px;
font-weight:bold;
margin:15px 0;
}

table{
width:100%;
border-collapse:collapse;
display:block;
overflow-x:auto;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
text-align:left;
white-space:nowrap;
}

.small{
font-size:13px;
color:#666;
}

.active{
color:green;
font-weight:bold;
}

.disabled{
color:#b00020;
font-weight:bold;
}

.admin-item{
border:1px solid #ddd;
border-radius:10px;
padding:12px;
margin-bottom:10px;
}

.admin-item button{
margin:3px;
}

.receipt{
font-family:monospace;
font-size:13px;
}

.summary{
background:#f7f7f7;
border-radius:8px;
padding:10px;
margin-top:10px;
}

@media(max-width:500px){

.container{
padding:10px;
}

.card{
padding:12px;
}

.cart-row{
font-size:14px;
}

.total{
font-size:22px;
}

}
</style>
</head>

<body>

<header>

<h2>🍗 FOOD POS</h2>

<div id="userInfo"></div>

</header>


<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="container login">

<div class="card">

<h2>🔐 Login</h2>

<label>User ID</label>

<input
id="loginId"
placeholder="Admin o Cashier ID"
autocomplete="username"
>

<label>Password</label>

<input
id="loginPassword"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button
class="primary"
style="width:100%"
onclick="login()"
>
LOGIN
</button>

<p class="small">

Admin:
<b>admin</b> / <b>2026</b>

<br>

Cashier:
<b>CASH001</b> / <b>2026</b>

</p>

</div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="container hidden">

<div class="tabs">

<button
class="primary"
onclick="showPage('posPage')"
>
🛒 POS
</button>

<button
onclick="showPage('historyPage')"
>
📋 History
</button>

<button
id="adminBtn"
onclick="showPage('adminPage')"
>
⚙️ Admin
</button>

<button
class="danger"
onclick="logout()"
>
Logout
</button>

</div>


<!-- =========================
     POS
========================= -->

<div id="posPage">

<div class="card">

<h3>Order Type</h3>

<button
id="dineBtn"
class="primary"
onclick="setOrderType('Dine In')"
>
🍽️ Dine In
</button>

<button
id="takeBtn"
onclick="setOrderType('Take Out')"
>
🥡 Take Out
</button>

<p>
Order #:
<b id="orderNumber">1001</b>
</p>

</div>


<div class="card">

<h3>Menu</h3>

<div
id="menuList"
class="menu"
></div>

</div>


<div class="card">

<h3>Current Order</h3>

<div id="cart"></div>

<div class="total">

Total:
₱<span id="total">0.00</span>

</div>

<label>Cash Received</label>

<input
id="cash"
type="number"
inputmode="decimal"
placeholder="Ilagay ang bayad"
oninput="calculateChange()"
>

<h3>

Sukli:
₱<span id="change">0.00</span>

</h3>

<button
class="green"
style="width:100%"
onclick="completeOrder()"
>
✅ COMPLETE ORDER
</button>

<button
class="gray"
style="width:100%;margin-top:8px"
onclick="clearCart()"
>
CLEAR ORDER
</button>

</div>

</div>


<!-- =========================
     HISTORY
========================= -->

<div
id="historyPage"
class="hidden"
>

<div class="card">

<h2>📋 Sales History</h2>

<button
class="gray"
onclick="clearHistory()"
>
Clear History
</button>

<div id="history"></div>

</div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div
id="adminPage"
class="hidden"
>


<!-- MENU MANAGEMENT -->

<div class="card">

<h2>🍔 Menu Management</h2>

<h3>Add Menu</h3>

<input
id="newName"
placeholder="Product name"
>

<input
id="newPrice"
type="number"
inputmode="decimal"
placeholder="Price"
>

<button
class="green"
onclick="addMenu()"
>
➕ Add Menu
</button>

</div>


<div class="card">

<h3>Existing Menu</h3>

<div id="adminMenu"></div>

</div>


<!-- CASHIER MANAGEMENT -->

<div class="card">

<h2>👤 Cashier Management</h2>

<h3>Add Cashier</h3>

<input
id="newCashierName"
placeholder="Cashier name"
>

<input
id="newCashierId"
placeholder="User ID"
>

<input
id="newCashierPassword"
type="password"
placeholder="Password"
>

<button
class="green"
onclick="addCashier()"
>
➕ Add Cashier
</button>

</div>


<div class="card">

<h3>Cashier Accounts</h3>

<div id="cashierList"></div>

</div>

</div>

</div>


<script>

/* =========================
   STORAGE
========================= */

function getStorageArray(key,fallback){

try{

let data=localStorage.getItem(key);

if(!data){
return fallback;
}

let parsed=JSON.parse(data);

return Array.isArray(parsed)
? parsed
: fallback;

}catch(error){

console.log(error);

return fallback;

}

}


/* =========================
   GLOBAL
========================= */

let currentUser=null;

let orderType="Dine In";

let cart=[];


/* =========================
   DEFAULT MENU
========================= */

let menu=getStorageArray(
"foodMenu",
[
{
id:1,
name:"Sundae",
price:50,
available:true
},
{
id:2,
name:"Fries",
price:50,
available:true
},
{
id:3,
name:"Fried Chicken",
price:99,
available:true
},
{
id:4,
name:"Float",
price:60,
available:true
}
]
);


/* =========================
   DEFAULT CASHIERS
========================= */

let cashiers=getStorageArray(
"foodCashiers",
[
{
id:"CASH001",
name:"Cashier 1",
password:"2026",
active:true
}
]
);


/* =========================
   SALES
========================= */

let sales=getStorageArray(
"foodSales",
[]
);


/* =========================
   ORDER NUMBER
========================= */

let savedOrderNumber=Number(
localStorage.getItem("orderNumber")
);

if(
!Number.isFinite(savedOrderNumber) ||
savedOrderNumber<1000
){

savedOrderNumber=1000;

}

let orderNo=savedOrderNumber+1;


/* =========================
   SAVE FUNCTIONS
========================= */

function saveMenu(){

try{

localStorage.setItem(
"foodMenu",
JSON.stringify(menu)
);

}catch(error){

console.log(error);

alert("Hindi ma-save ang menu.");

}

}


function saveCashiers(){

try{

localStorage.setItem(
"foodCashiers",
JSON.stringify(cashiers)
);

}catch(error){

console.log(error);

alert("Hindi ma-save ang cashier.");

}

}


/* =========================
   START
========================= */

document.addEventListener(
"DOMContentLoaded",
function(){

document.getElementById(
"orderNumber"
).innerText=orderNo;

renderMenu();
renderCart();
renderHistory();
renderAdminMenu();
renderCashiers();

}
);


/* =========================
   LOGIN
========================= */

function login(){

let id=document.getElementById(
"loginId"
).value.trim().toLowerCase();

let password=document.getElementById(
"loginPassword"
).value.trim();


/* ADMIN */

if(
id==="admin" &&
password==="2026"
){

currentUser={
id:"admin",
name:"Administrator",
role:"admin"
};

}

/* CASHIER */

else{

let cashier=cashiers.find(
function(x){

return(
String(x.id)
.trim()
.toLowerCase()===id
&&
String(x.password)
.trim()===password
);

}
);


if(!cashier){

alert(
"Mali ang User ID o Password."
);

return;

}


if(!cashier.active){

alert(
"Disabled ang cashier account."
);

return;

}


currentUser={
id:cashier.id,
name:cashier.name,
role:"cashier"
};

}


document.getElementById(
"loginPage"
).classList.add("hidden");

document.getElementById(
"app"
).classList.remove("hidden");


document.getElementById(
"userInfo"
).innerText=
currentUser.role.toUpperCase()
+
" • "
+
currentUser.name
+
" • ID: "
+
currentUser.id;


document.getElementById(
"adminBtn"
).style.display=
currentUser.role==="admin"
? "block"
: "none";


renderMenu();
renderCart();
renderHistory();
renderAdminMenu();
renderCashiers();

showPage("posPage");

}


/* =========================
   LOGOUT
========================= */

function logout(){

currentUser=null;

cart=[];

document.getElementById(
"app"
).classList.add("hidden");

document.getElementById(
"loginPage"
).classList.remove("hidden");

document.getElementById(
"loginId"
).value="";

document.getElementById(
"loginPassword"
).value="";

clearCart();

}


/* =========================
   PAGE
========================= */

function showPage(page){

if(
page==="adminPage" &&
(
!currentUser ||
currentUser.role!=="admin"
)
){

alert(
"Admin lang ang puwedeng pumasok dito."
);

return;

}


document.getElementById(
"posPage"
).classList.add("hidden");

document.getElementById(
"historyPage"
).classList.add("hidden");

document.getElementById(
"adminPage"
).classList.add("hidden");


let selected=document.getElementById(page);

if(selected){

selected.classList.remove("hidden");

}

}


/* =========================
   ORDER TYPE
========================= */

function setOrderType(type){

orderType=type;

document.getElementById(
"dineBtn"
).className=
type==="Dine In"
? "primary"
: "";

document.getElementById(
"takeBtn"
).className=
type==="Take Out"
? "primary"
: "";

}


/* =========================
   RENDER MENU
========================= */

function renderMenu(){

let html="";

menu.forEach(
function(item){

let id=Number(item.id);

html+=`

<div class="product ${
item.available ? "" : "out"
}">

<h3>
${escapeHtml(item.name)}
</h3>

<div class="price">
₱${Number(item.price).toFixed(2)}
</div>

${
item.available

?

`<button
class="primary"
style="width:100%;margin-top:8px"
onclick="addToCart(${id})"
>
ADD
</button>`

:

`<button
disabled
style="width:100%;margin-top:8px"
>
OUT OF STOCK
</button>`

}

</div>

`;

}
);


document.getElementById(
"menuList"
).innerHTML=html;

}


/* =========================
   ADD CART
========================= */

function addToCart(id){

let item=menu.find(
function(x){

return Number(x.id)===Number(id);

}
);


if(
!item ||
!item.available
){

return;

}


let existing=cart.find(
function(x){

return Number(x.id)===Number(id);

}
);


if(existing){

existing.qty++;

}else{

cart.push({

id:Number(item.id),

name:item.name,

price:Number(item.price),

qty:1

});

}


renderCart();

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

let html="";


if(cart.length===0){

html="<p>Wala pang order.</p>";

}


cart.forEach(
function(item){

html+=`

<div class="cart-row">

<div>

<b>
${escapeHtml(item.name)}
</b>

<br>

₱${Number(item.price).toFixed(2)}

</div>


<div class="qty">

<button
onclick="changeQty(${item.id},-1)"
>
-
</button>

<b>${item.qty}</b>

<button
onclick="changeQty(${item.id},1)"
>
+
</button>

</div>


<b>

₱${
(
Number(item.price)*
Number(item.qty)
).toFixed(2)
}

</b>

</div>

`;

}
);


document.getElementById(
"cart"
).innerHTML=html;

updateTotal();

}


/* =========================
   QUANTITY
========================= */

function changeQty(id,amount){

let item=cart.find(
function(x){

return Number(x.id)===Number(id);

}
);


if(!item){
return;
}


item.qty+=amount;


if(item.qty<=0){

cart=cart.filter(
function(x){

return Number(x.id)!==Number(id);

}
);

}


renderCart();

}


/* =========================
   TOTAL
========================= */

function getTotal(){

return cart.reduce(
function(sum,item){

return sum+
(
Number(item.price)*
Number(item.qty)
);

},
0
);

}


function updateTotal(){

document.getElementById(
"total"
).innerText=
getTotal().toFixed(2);

calculateChange();

}


/* =========================
   CHANGE
========================= */

function calculateChange(){

let total=getTotal();

let cash=Number(
document.getElementById(
"cash"
).value||0
);

let change=cash-total;

document.getElementById(
"change"
).innerText=
(
change>0
? change
: 0
).toFixed(2);

}


/* =========================
   CLEAR CART
========================= */

function clearCart(){

cart=[];

document.getElementById(
"cash"
).value="";

document.getElementById(
"change"
).innerText="0.00";

renderCart();

}


/* =========================
   COMPLETE ORDER
========================= */

function completeOrder(){

if(!currentUser){

alert("Mag-login muna.");

return;

}


if(cart.length===0){

alert("Wala pang order.");

return;

}


let total=getTotal();

let cash=Number(
document.getElementById(
"cash"
).value||0
);


if(cash<total){

alert(
"Kulang ang bayad.\n\n"+
"Total: ₱"+
total.toFixed(2)
);

return;

}


let change=cash-total;


let sale={

orderNo:orderNo,

date:new Date().toLocaleString(),

cashier:currentUser.id,

cashierName:currentUser.name,

type:orderType,

items:cart.map(
function(item){

return{

id:item.id,

name:item.name,

price:Number(item.price),

qty:Number(item.qty)

};

}
),

total:total,

cash:cash,

change:change

};


sales.unshift(sale);


try{

localStorage.setItem(
"foodSales",
JSON.stringify(sales)
);

localStorage.setItem(
"orderNumber",
String(orderNo)
);

}catch(error){

console.log(error);

alert(
"May problema sa pag-save ng order."
);

return;

}


alert(
"ORDER COMPLETED!\n\n"+
"Order #: "+orderNo+
"\nTotal: ₱"+total.toFixed(2)+
"\nBayad: ₱"+cash.toFixed(2)+
"\nSukli: ₱"+change.toFixed(2)
);


orderNo++;

document.getElementById(
"orderNumber"
).innerText=orderNo;

clearCart();

renderHistory();

}


/* =========================
   HISTORY
========================= */

function renderHistory(){

let container=document.getElementById(
"history"
);

if(!container){
return;
}


if(sales.length===0){

container.innerHTML=
"<p>Wala pang sales history.</p>";

return;

}


let html="";


sales.forEach(
function(sale){

html+=`

<div class="admin-item">

<b>
Order #${sale.orderNo}
</b>

<br>

<span class="small">
${escapeHtml(sale.date||"")}
</span>

<div class="summary">

<b>
Cashier:
</b>
${escapeHtml(sale.cashierName||sale.cashier||"")}

<br>

<b>
Type:
</b>
${escapeHtml(sale.type||"")}

<br>

<b>
Total:
</b>
₱${Number(sale.total||0).toFixed(2)}

<br>

<b>
Cash:
</b>
₱${Number(sale.cash||0).toFixed(2)}

<br>

<b>
Change:
</b>
₱${Number(sale.change||0).toFixed(2)}

</div>

<div style="margin-top:8px">

`;

if(Array.isArray(sale.items)){

sale.items.forEach(
function(item){

html+=`

<div>
${escapeHtml(item.name)}
x${Number(item.qty)}
=
₱${(
Number(item.price)*
Number(item.qty)
).toFixed(2)}
</div>

`;

}
);

}

html+=`

</div>

</div>

`;

}
);


container.innerHTML=html;

}


/* =========================
   CLEAR HISTORY
========================= */

function clearHistory(){

if(
!currentUser ||
currentUser.role!=="admin"
){

alert(
"Admin lang ang puwedeng mag-clear ng history."
);

return;

}


if(!confirm(
"Sigurado ka bang buburahin ang lahat ng sales history?"
)){

return;

}


sales=[];

localStorage.removeItem(
"foodSales"
);

localStorage.removeItem(
"orderNumber"
);

orderNo=1001;

document.getElementById(
"orderNumber"
).innerText=orderNo;

renderHistory();

alert(
"Na-clear na ang history.\n\n"+
"Ang susunod na Order Number ay #1001."
);

}


/* =========================
   ADMIN MENU
========================= */

function renderAdminMenu(){

let container=document.getElementById(
"adminMenu"
);

if(!container){
return;
}


if(menu.length===0){

container.innerHTML=
"<p>Wala pang menu.</p>";

return;

}


let html="";


menu.forEach(
function(item){

html+=`

<div class="admin-item">

<h3>
${escapeHtml(item.name)}
</h3>

<p>
Price:
<b>
₱${Number(item.price).toFixed(2)}
</b>
</p>

<p>

Status:

${
item.available

?
`<span class="active">AVAILABLE</span>`

:
`<span class="disabled">OUT OF STOCK</span>`
}

</p>


<button
class="blue"
onclick="editMenu(${Number(item.id)})"
>
✏️ Edit
</button>


<button
class="gray"
onclick="toggleStock(${Number(item.id)})"
>
${
item.available
? "🚫 Out of Stock"
: "✅ Available"
}
</button>


<button
class="danger"
onclick="deleteMenu(${Number(item.id)})"
>
🗑️ Delete
</button>

</div>

`;

}
);


container.innerHTML=html;

}


/* =========================
   ADD MENU
========================= */

function addMenu(){

if(
!currentUser ||
currentUser.role!=="admin"
){

alert("Admin lang ang puwedeng magdagdag ng menu.");

return;

}


let name=document.getElementById(
"newName"
).value.trim();

let price=Number(
document.getElementById(
"newPrice"
).value
);


if(!name){

alert("Ilagay ang pangalan ng menu.");

return;

}


if(
!Number.isFinite(price) ||
price<=0
){

alert("Ilagay ang tamang presyo.");

return;

}


let nextId=1;

if(menu.length>0){

nextId=
Math.max(
...menu.map(
function(x){
return Number(x.id)||0;
}
)
)+1;

}


menu.push({

id:nextId,

name:name,

price:price,

available:true

});


saveMenu();

renderMenu();

renderAdminMenu();


document.getElementById(
"newName"
).value="";

document.getElementById(
"newPrice"
).value="";

alert(
"Naidagdag na ang menu."
);

}


/* =========================
   EDIT MENU
========================= */

function editMenu(id){

let item=menu.find(
function(x){

return Number(x.id)===Number(id);

}
);


if(!item){
return;
}


let newName=prompt(
"Product name:",
item.name
);


if(newName===null){
return;
}


newName=newName.trim();


if(!newName){

alert("Hindi puwedeng walang pangalan.");

return;

}


let newPrice=prompt(
"Price:",
item.price
);


if(newPrice===null){
return;
}


newPrice=Number(newPrice);


if(
!Number.isFinite(newPrice) ||
newPrice<=0
){

alert("Hindi valid ang price.");

return;

}


item.name=newName;

item.price=newPrice;

saveMenu();

renderMenu();

renderAdminMenu();

alert(
"Na-update na ang menu."
);

}


/* =========================
   DELETE MENU
========================= */

function deleteMenu(id){

let item=menu.find(
function(x){

return Number(x.id)===Number(id);

}
);


if(!item){
return;
}


if(
!confirm(
"Burahin ang "+item.name+"?"
)
){

return;

}


menu=menu.filter(
function(x){

return Number(x.id)!==Number(id);

}
);


saveMenu();

renderMenu();

renderAdminMenu();

}


/* =========================
   TOGGLE STOCK
========================= */

function toggleStock(id){

let item=menu.find(
function(x){

return Number(x.id)===Number(id);

}
);


if(!item){
return;
}


item.available=!item.available;

saveMenu();

renderMenu();

renderAdminMenu();

}


/* =========================
   CASHIER LIST
========================= */

function renderCashiers(){

let container=document.getElementById(
"cashierList"
);

if(!container){
return;
}


if(cashiers.length===0){

container.innerHTML=
"<p>Wala pang cashier account.</p>";

return;

}


let html="";


cashiers.forEach(
function(cashier){

html+=`

<div class="admin-item">

<h3>
${escapeHtml(cashier.name)}
</h3>

<p>
ID:
<b>
${escapeHtml(cashier.id)}
</b>
</p>

<p>

Status:

${
cashier.active

?
`<span class="active">ACTIVE</span>`

:
`<span class="disabled">DISABLED</span>`
}

</p>


<button
class="blue"
onclick="editCashier('${safeJs(cashier.id)}')"
>
✏️ Edit
</button>


<button
class="gray"
onclick="toggleCashier('${safeJs(cashier.id)}')"
>
${
cashier.active
? "🚫 Disable"
: "✅ Enable"
}
</button>


<button
class="danger"
onclick="deleteCashier('${safeJs(cashier.id)}')"
>
🗑️ Delete
</button>

</div>

`;

}
);


container.innerHTML=html;

}


/* =========================
   ADD CASHIER
========================= */

function addCashier(){

if(
!currentUser ||
currentUser.role!=="admin"
){

alert(
"Admin lang ang puwedeng magdagdag ng cashier."
);

return;

}


let name=document.getElementById(
"newCashierName"
).value.trim();

let id=document.getElementById(
"newCashierId"
).value.trim();

let password=document.getElementById(
"newCashierPassword"
).value.trim();


if(!name){

alert("Ilagay ang pangalan ng cashier.");

return;

}


if(!id){

alert("Ilagay ang User ID.");

return;

}


if(!password){

alert("Ilagay ang password.");

return;

}


let exists=cashiers.some(
function(x){

return String(x.id)
.trim()
.toLowerCase()
===
id.toLowerCase();

}
);


if(exists){

alert(
"May gumagamit na ng User ID na ito."
);

return;

}


cashiers.push({

id:id,

name:name,

password:password,

active:true

});


saveCashiers();

renderCashiers();


document.getElementById(
"newCashierName"
).value="";

document.getElementById(
"newCashierId"
).value="";

document.getElementById(
"newCashierPassword"
).value="";


alert(
"Naidagdag na ang cashier."
);

}


/* =========================
   EDIT CASHIER
========================= */

function editCashier(id){

let cashier=cashiers.find(
function(x){

return String(x.id)===String(id);

}
);


if(!cashier){
return;
}


let newName=prompt(
"Cashier name:",
cashier.name
);


if(newName===null){
return;
}


newName=newName.trim();


if(!newName){

alert("Hindi puwedeng walang pangalan.");

return;

}


let newPassword=prompt(
"Password:",
cashier.password
);


if(newPassword===null){
return;
}


newPassword=newPassword.trim();


if(!newPassword){

alert("Hindi puwedeng walang password.");

return;

}


cashier.name=newName;

cashier.password=newPassword;

saveCashiers();

renderCashiers();

alert(
"Na-update na ang cashier."
);

}


/* =========================
   TOGGLE CASHIER
========================= */

function toggleCashier(id){

let cashier=cashiers.find(
function(x){

return String(x.id)===String(id);

}
);


if(!cashier){
return;
}


cashier.active=!cashier.active;

saveCashiers();

renderCashiers();

}


/* =========================
   DELETE CASHIER
========================= */

function deleteCashier(id){

let cashier=cashiers.find(
function(x){

return String(x.id)===String(id);

}
);


if(!cashier){
return;
}


if(
String(cashier.id).toLowerCase()
===
"cash001"
){

if(
!confirm(
"Burahin din ang default CASH001?"
)
){

return;

}

}


if(
!confirm(
"Burahin ang cashier "+cashier.name+"?"
)
){

return;

}


cashiers=cashiers.filter(
function(x){

return String(x.id)!==String(id);

}
);


saveCashiers();

renderCashiers();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   SAFE JAVASCRIPT VALUE
========================= */

function safeJs(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,"&quot;");

}
